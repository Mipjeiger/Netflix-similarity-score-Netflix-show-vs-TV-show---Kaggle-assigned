[core]
dags_folder = /opt/airflow/dags
plugins_folder = /opt/airflow/plugins
executor = LocalExecutor
load_examples = False
default_timezone = UTC

[database]
sql_alchemy_conn = postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

[webserver]
default_ui_timezone = UTC
site_title = Netflix MLOps Pipeline 🍿
hide_sensitive_var_conn_fields = True # Disables initial warning popups in the web UI

[scheduler]
catchup_by_default = False # Prevents backfilling historical dates
dag_dir_list_interval = 15 # Faster directory polling to detect new/updated DAG files quickly (in seconds)

[api]
# Required so your FastAPI service or scripts can trigger DAGs via REST API
auth_backends = airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session