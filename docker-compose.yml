services:

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - netflix_network

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - netflix_network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - netflix_network

  mlflow:
    build: ./mlflow
    container_name: mlflow
    ports:
      - "5001:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
      - ./data/models:/mlflow/host_models
    environment:
      - BACKEND_STORE_URI=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      - ARTIFACT_ROOT=/mlflow/artifacts
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
    networks:
      - netflix_network

  airflow:
    build: ./airflow
    container_name: airflow
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      bash -lc "mkdir -p /mlflow/artifacts && chmod -R 777 /mlflow 2>/dev/null || true; airflow db init &&
      airflow users create --username \"${AIRFLOW_WWW_USER}\" --password \"${AIRFLOW_WWW_PASSWORD}\" --firstname \"${AIRFLOW_WWW_FIRSTNAME}\" --lastname \"${AIRFLOW_WWW_LASTNAME}\" --email \"${AIRFLOW_WWW_EMAIL}\" --role Admin || true &&
      airflow webserver --port 8080"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - PYTHONPATH=/opt/airflow
      - GIT_PYTHON_REFRESH=quiet
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    networks:
      - netflix_network
    depends_on:
      - postgres
      - redis
      - mlflow

  airflow-scheduler:
    build: ./airflow
    container_name: airflow-scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      bash -lc "mkdir -p /mlflow/artifacts && chmod -R 777 /mlflow 2>/dev/null || true; exec airflow scheduler"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - PYTHONPATH=/opt/airflow
      - GIT_PYTHON_REFRESH=quiet
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    networks:
      - netflix_network
    depends_on:
      - postgres
      - redis
      - airflow
    
  api:
    build: ./api
    container_name: api
    ports:
      - "8000:8000"
    volumes:
      - ./data/models:/app/models
      - ./config:/app/config
      - ./api:/app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    networks:
      - netflix_network

  streamlit:
    build: ./streamlit
    container_name: streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - API_URL=http://api:8000
    networks:
      - netflix_network
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - netflix_network

  grafana:
    build: ./monitoring/grafana
    container_name: grafana
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    networks:
      - netflix_network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  mlflow_artifacts:
  grafana_data:

networks:
  netflix_network:
    driver: bridge
