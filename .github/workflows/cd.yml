name: CD Pipeline (Docker Hub + SSH)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: netflix-mlops

jobs:
  deploy-to-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          REGISTRY_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          
          docker build -t $REGISTRY_IMAGE:$IMAGE_TAG -t $REGISTRY_IMAGE:staging -f api/Dockerfile .
          docker push $REGISTRY_IMAGE:$IMAGE_TAG
          docker push $REGISTRY_IMAGE:staging

      - name: Deploy via SSH to Staging Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:staging
            docker stop netflix-api-staging || true
            docker rm netflix-api-staging || true
            docker run -d --name netflix-api-staging -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:staging

      - name: Health check
        run: |
          sleep 10
          curl -f http://${{ secrets.STAGING_SERVER_HOST }}:8000/health || exit 1