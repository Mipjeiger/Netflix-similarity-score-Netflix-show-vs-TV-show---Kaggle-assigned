name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Manual run on-demand

jobs:
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install security tools
        run: |
          pip install bandit safety
          npm install -g snyk

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      - name: Check dependencies for known vulnerabilities
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: high

      - name: Run Bandit security linter
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -ll || true

      - name: Check for vulnerabilities with Safety
        run: |
          safety check --full-report || true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Scan Docker images
        run: |
          trivy image ${{ secrets.DOCKER_USERNAME }}/netflix-api:latest \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed || true

      - name: Check secrets in code
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate security report
        run: |
          echo "# 🔒 Security Scan Report" > security_report.md
          echo "Generated: $(date)" >> security_report.md
          echo "Status: ${{ job.status }}" >> security_report.md
          echo "" >> security_report.md
          echo "## Issues Found" >> security_report.md
          echo "- Run Bandit report for details" >> security_report.md
          echo "- Check CodeQL findings" >> security_report.md

      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: |
            security_report.md
            bandit-report.json
            trivy-results.sarif

      - name: Slack notification - Security Alert
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚨 SECURITY ALERT!\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nPlease check the security scan results immediately!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}